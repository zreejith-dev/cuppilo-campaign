<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YOU'RE PART OF THE BREW — CUPPILO</title>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#872419"/>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    .thankyou{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:5rem 1.25rem 3rem;background:linear-gradient(180deg,#fff8f5 0%,#f4ece8 100%)}
    .thankyou-inner{max-width:480px;width:100%}
    .thankyou-icon{margin-bottom:1rem;color:var(--primary)}
    .thankyou h1{font-size:2rem;font-weight:800;color:var(--charcoal);margin-bottom:1rem;letter-spacing:-.02em}
    .thankyou h1 .accent{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;color:var(--primary)}
    .thankyou-quote{font-size:1rem;color:var(--on-sv);line-height:1.7;margin-bottom:1.5rem;font-weight:500}
    .thankyou-flow{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.875rem;font-weight:600;color:var(--primary);margin-bottom:2rem;flex-wrap:wrap}
    .thankyou-flow span{white-space:nowrap}
    .thankyou-hook{font-size:1.125rem;font-weight:600;color:var(--charcoal);font-style:italic;line-height:1.6;margin-bottom:2.5rem;padding:0 1rem;font-family:'Playfair Display',serif}
    .thankyou-actions{display:flex;flex-direction:column;gap:.75rem;align-items:center}
    .thankyou-actions a{width:100%;max-width:280px}
  </style>
</head>
<body>

  <!-- TOP BAR — Logo top left -->
  <header class="topbar">
    <img src="img/logo.png" alt="CUPPILO" class="topbar-logo"/>
  </header>

  <main>
    <section class="thankyou">
      <div class="thankyou-inner">
        <span class="material-symbols-outlined thankyou-icon" style="font-size:4rem">local_cafe</span>
        <h1>YOU'RE PART OF <span class="accent">THE BREW.</span></h1>
        <p class="thankyou-quote">Thank you for helping shape Cuppilo.</p>
        <div class="thankyou-flow">
          <span>Your idea</span>
          <span>→</span>
          <span>Our research</span>
          <span>→</span>
          <span>Tomorrow's café</span>
        </div>
        <p class="thankyou-hook">Maybe one day, you'll walk into Cuppilo and see something you suggested.</p>
        <div class="thankyou-actions">
          <a href="https://www.instagram.com/cuppilo.campaign" class="footer-insta" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            Follow on Instagram
          </a>
          <a href="index.html" class="btn btn-outline">
            <span>Back to Cuppilo</span>
          </a>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
